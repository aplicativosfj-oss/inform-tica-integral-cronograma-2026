<title>Observatório Pedagógico Eiraldo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#EEF1F5;--card:#FFFFFF;--side:#15263A;--sideInk:#C9D6E4;--ink:#17283A;--mut:#5A6B7D;--line:#DCE2EA;--acc:#2F5D8C;--acc2:#E3EBF5;--accB:#C0782F;
--ot:#2E8B57;--bo:#8DB255;--re:#E0A12E;--in:#C8553D;--na:#CDD4DD;--grid:#E6EBF1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1620;--card:#172230;--side:#0B121B;--sideInk:#A9B9CA;--ink:#E5ECF4;--mut:#98A9BB;--line:#283646;--acc:#7FB0E0;--acc2:#1E3045;--accB:#E3A262;--na:#34414F;--grid:#223040}}
:root[data-theme="dark"]{--bg:#0F1620;--card:#172230;--side:#0B121B;--sideInk:#A9B9CA;--ink:#E5ECF4;--mut:#98A9BB;--line:#283646;--acc:#7FB0E0;--acc2:#1E3045;--accB:#E3A262;--na:#34414F;--grid:#223040}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",system-ui,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{background:var(--side);color:var(--sideInk);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font:800 18px/1.15 "Bricolage Grotesque",sans-serif;color:#fff;padding:0 10px 16px}
.brand small{display:block;font:600 11px "Source Sans 3",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--sideInk);margin-top:6px}
nav.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:600}
nav.side button:hover{background:rgba(255,255,255,.06)}
nav.side button[aria-current=page]{background:rgba(127,176,224,.18);color:#fff}
nav.side button:focus-visible{outline:2px solid #7FB0E0}
.side .foot{margin-top:auto;font-size:12px;padding:10px;opacity:.8}
main{padding-inline:clamp(16px,3vw,36px);padding-block:26px 60px;display:grid;gap:22px;align-content:start;min-width:0}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,3vw,32px);font-weight:800}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}
.mut{color:var(--mut)} .sm{font-size:13px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font:800 28px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 13px "Source Sans 3",sans-serif;border:0;background:var(--card);color:var(--ink);padding:7px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--card)}
.btn{font:600 13px "Source Sans 3",sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select,input{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
label.f{display:grid;gap:4px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;white-space:nowrap}
th.s{cursor:pointer} th.s:hover{color:var(--ink)}
td.n,th.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--acc2)}
.heat td.c{text-align:center;font-weight:700;border:3px solid var(--card);border-radius:6px;color:#fff;cursor:pointer}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.OT{background:var(--ot)}.BO{background:var(--bo)}.RE{background:var(--re)}.IN{background:var(--in)}.NA{background:var(--na);color:var(--ink)}
.bar{height:9px;border-radius:5px;background:var(--acc2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.stack{display:flex;height:20px;border-radius:5px;overflow:hidden;background:var(--acc2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c);vertical-align:-1px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:13px;height:13px;border-radius:3px;display:inline-block}
.delta{font:500 12.5px "JetBrains Mono",monospace}
.up{color:var(--ot)} .dn{color:var(--in)}
.note{font-size:14px;border-left:3px solid var(--re);padding-left:10px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--acc2);border-radius:999px;padding:3px 6px 3px 11px;font-size:13px;font-weight:600}
.chip button{border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.cmpcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;border-top:4px solid var(--c)}
svg text{fill:var(--mut);font:12px "Source Sans 3",sans-serif}
svg .lbl{fill:var(--ink);font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0;width:min(760px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,20,30,.5)}
.dlg{padding:22px;display:grid;gap:16px}
.topbar{display:none}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px 16px;gap:4px}
 .brand{width:100%;padding:0 0 8px}.side .foot{display:none}
 nav.side button{padding:6px 10px;font-size:14px}
}
@media print{nav.side,.noprint{display:none!important}.app{display:block}.panel{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div class="app">
<nav class="side" id="nav" aria-label="Seções">
 <div class="brand">Observatório Pedagógico<small>Dr. Eiraldo · 2026</small></div>
</nav>
<main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
const D=/*DATA*/;
const DN={LP:"Língua Portuguesa",MAT:"Matemática",CN:"Ciências da Natureza"},DS=["LP","MAT","CN"],DSH={LP:"Português",MAT:"Matemática",CN:"Ciências"};
const cls=p=>p==null?"NA":p>=70?"OT":p>=50?"BO":p>=25?"RE":"IN";
const lab={OT:"Ótimo",BO:"Bom",RE:"Regular",IN:"Insuficiente",NA:"—"};
const col=k=>"var(--"+({OT:"ot",BO:"bo",RE:"re",IN:"in",NA:"na"})[k]+")";
const pct=x=>x==null||isNaN(x)?"—":Math.round(x)+"%";
const avg=x=>x.length?x.reduce((a,b)=>a+b,0)/x.length:null;
const med=x=>{if(!x.length)return null;const s=[...x].sort((a,b)=>a-b),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const qt=(x,q)=>{const s=[...x].sort((a,b)=>a-b),p=(s.length-1)*q,b=Math.floor(p);return s[b]+(s[b+1]!==undefined?(p-b)*(s[b+1]-s[b]):0)};
const sd=x=>{const m=avg(x);return Math.sqrt(avg(x.map(v=>(v-m)**2)))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const dl=(v,suf="pp")=>{if(v==null||isNaN(v))return"";const r=Math.round(v);return `<span class="delta ${r>0?"up":r<0?"dn":""}">${r>0?"+":""}${r}${suf}</span>`};
const pillP=p=>p==null?`<span class="pill NA">—</span>`:`<span class="pill ${cls(p)}">${pct(p)}</span>`;
const barP=p=>`<div class="row" style="flex-wrap:nowrap;gap:8px"><div class="bar" style="flex:1"><i style="width:${p||0}%;background:${col(cls(p))}"></i></div><b style="min-width:38px;text-align:right">${pct(p)}</b></div>`;
/* ---------- modelo ---------- */
D.forEach(t=>{t.key=t.ano+"º "+t.turma;t.qs=Object.keys(t.hab).map(Number).sort((a,b)=>a-b);
 t.alunos.forEach(a=>{a.ok=!a.r.includes("-");a.dup=a.nome.startsWith("Linha");if(a.ok)a.p=100*[...a.r].filter(c=>c=="C").length/a.r.length});
 t.feitos=t.alunos.filter(a=>a.ok&&!a.dup);const ps=t.feitos.map(a=>a.p);
 t.m={media:avg(ps),mediana:med(ps),dp:sd(ps),min:Math.min(...ps),max:Math.max(...ps),q1:qt(ps,.25),q3:qt(ps,.75),
  adeq:100*ps.filter(p=>p>=70).length/ps.length,crit:100*ps.filter(p=>p<25).length/ps.length,abaixo50:100*ps.filter(p=>p<50).length/ps.length,
  part:100*t.feitos.length/t.alunos.filter(a=>!a.dup).length,n:t.feitos.length,aus:t.alunos.filter(a=>!a.ok&&!a.dup).length};
 t.qp=t.qs.map((q,i)=>100*t.feitos.filter(a=>a.r[i]=="C").length/t.feitos.length);});
const T=[...new Set(D.map(t=>t.key))].sort();
const get=(k,d)=>D.find(t=>t.key==k&&t.disc==d);
const profOf=k=>get(k,"LP").prof;
/* alunos consolidados */
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const AL={};
D.forEach(t=>t.alunos.forEach(a=>{if(a.dup)return;const id=t.key+"|"+norm(a.nome);const o=AL[id]??={id,nome:a.nome,turma:t.key,ano:t.ano,d:{},r:{},esc:null};
 if(a.ok){o.d[t.disc]=a.p;o.r[t.disc]=a.r}if(a.esc)o.esc=a.esc;if(/especial/i.test(a.nome))o.esp=true}));
const ALS=Object.values(AL).map(o=>{const v=Object.values(o.d);o.media=avg(v);o.nd=v.length;return o}).filter(o=>o.nd>0);
ALS.forEach(o=>{DS.forEach(d=>{if(o.d[d]==null)return;const peers=ALS.filter(x=>x.turma==o.turma&&x.d[d]!=null).map(x=>x.d[d]);o["pos"+d]=100*peers.filter(p=>p<o.d[d]).length/Math.max(1,peers.length-1)})});
const turmaMedia=k=>avg(DS.map(d=>get(k,d).m.media));
/* ---------- SVG helpers ---------- */
function hbars(items,{w=560,max=100,color}={}){const rh=26,lw=110,h=items.length*rh+24;let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
 [0,25,50,75,100].forEach(v=>{const x=lw+(w-lw-44)*v/max;s+=`<line x1="${x}" y1="0" x2="${x}" y2="${h-18}" stroke="var(--grid)"/><text x="${x}" y="${h-4}" text-anchor="middle">${v}%</text>`});
 items.forEach((it,i)=>{const y=i*rh+4,bw=(w-lw-44)*(it.v||0)/max;s+=`<text class="lbl" x="${lw-8}" y="${y+14}" text-anchor="end">${esc(it.l)}</text><rect x="${lw}" y="${y+3}" width="${bw}" height="15" rx="3" fill="${it.c||color||col(cls(it.v))}"/><text x="${lw+bw+5}" y="${y+15}">${pct(it.v)}</text>`});
 return s+"</svg>"}
function groupBars(groups,series,{w=620,h=240}={}){// groups:[{l,vals:[..]}], series:[{l,c}]
 const pl=34,pb=38,pt=10,gw=(w-pl-10)/groups.length,bw=Math.min(26,(gw-14)/series.length);let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
 [0,25,50,75,100].forEach(v=>{const y=pt+(h-pt-pb)*(1-v/100);s+=`<line x1="${pl}" x2="${w-6}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`});
 groups.forEach((g,i)=>{const x0=pl+i*gw+(gw-bw*series.length)/2;g.vals.forEach((v,j)=>{if(v==null)return;const bh=(h-pt-pb)*v/100;s+=`<rect x="${x0+j*bw}" y="${pt+(h-pt-pb)-bh}" width="${bw-3}" height="${bh}" rx="2" fill="${series[j].c}"><title>${esc(series[j].l)} · ${esc(g.l)}: ${pct(v)}</title></rect>`});
  s+=`<text class="lbl" x="${pl+i*gw+gw/2}" y="${h-pb+18}" text-anchor="middle">${esc(g.l)}</text>`});
 return s+"</svg>"}
function boxes(ts,{w=620}={}){const rh=30,lw=60,h=ts.length*rh+26,X=v=>lw+(w-lw-16)*v/100;let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
 [0,25,50,75,100].forEach(v=>s+=`<line x1="${X(v)}" x2="${X(v)}" y1="0" y2="${h-20}" stroke="var(--grid)"/><text x="${X(v)}" y="${h-5}" text-anchor="middle">${v}%</text>`);
 ts.forEach((t,i)=>{const y=i*rh+14,m=t.m;s+=`<text class="lbl" x="${lw-8}" y="${y+4}" text-anchor="end">${t.key}</text><line x1="${X(m.min)}" x2="${X(m.max)}" y1="${y}" y2="${y}" stroke="var(--mut)"/><rect x="${X(m.q1)}" y="${y-8}" width="${Math.max(2,X(m.q3)-X(m.q1))}" height="16" rx="3" fill="var(--acc2)" stroke="var(--acc)"/><line x1="${X(m.mediana)}" x2="${X(m.mediana)}" y1="${y-8}" y2="${y+8}" stroke="var(--acc)" stroke-width="3"/><circle cx="${X(m.media)}" cy="${y}" r="3.5" fill="var(--accB)"><title>média ${pct(m.media)}</title></circle><title>${t.key}: mín ${pct(m.min)} · Q1 ${pct(m.q1)} · mediana ${pct(m.mediana)} · Q3 ${pct(m.q3)} · máx ${pct(m.max)}</title>`});
 return s+"</svg>"}
function scatter(pts,xl,yl,{w=560,h=380}={}){const p=40,X=v=>p+(w-p-12)*v/100,Y=v=>h-p-(h-p-12)*v/100;let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
 [0,25,50,75,100].forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${Y(0)}" y2="${Y(100)}" stroke="var(--grid)"/><line x1="${X(0)}" x2="${X(100)}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${X(v)}" y="${h-p+16}" text-anchor="middle">${v}</text><text x="${p-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
 s+=`<rect x="${X(0)}" y="${Y(50)}" width="${X(50)-X(0)}" height="${Y(0)-Y(50)}" fill="var(--in)" opacity=".07"/>`;
 s+=`<text class="lbl" x="${(X(0)+X(100))/2}" y="${h-6}" text-anchor="middle">${xl}</text><text class="lbl" transform="translate(12 ${(Y(0)+Y(100))/2}) rotate(-90)" text-anchor="middle">${yl}</text>`;
 const jit=i=>((i*37)%7-3)*0.5;pts.forEach((q,i)=>s+=`<circle cx="${X(q.x)+jit(i)}" cy="${Y(q.y)+jit(i+3)}" r="4.5" fill="${q.c}" fill-opacity=".75" stroke="var(--card)"><title>${esc(q.l)}: ${pct(q.x)} × ${pct(q.y)}</title></circle>`);
 return s+"</svg>"}
const TC=["#2F5D8C","#C0782F","#2E8B57","#8E4A9E","#C8553D"];
/* ---------- páginas ---------- */
const PAGES=[["geral","Visão geral"],["turmas","Comparar turmas"],["alunos","Comparar alunos"],["hab","Habilidades"],["lista","Todos os alunos"],["esc","Escrita"],["dados","Qualidade dos dados"]];
let page="geral";try{page=localStorage.getItem("obs.page")||"geral"}catch(e){}
const nav=document.getElementById("nav"),main=document.getElementById("main");
nav.insertAdjacentHTML("beforeend",PAGES.map(([k,l])=>`<button data-p="${k}">${l}</button>`).join("")+`<div class="foot">II Avaliação Diagnóstica · SEME<br>Aplicação 25–27/06/2026<br>Faixas: Ótimo ≥70 · Bom 50–69 · Regular 25–49 · Insuf. &lt;25</div>`);
nav.onclick=e=>{const b=e.target.closest("[data-p]");if(b)go(b.dataset.p)};
function go(p){page=p;try{localStorage.setItem("obs.page",p)}catch(e){}nav.querySelectorAll("[data-p]").forEach(b=>b.toggleAttribute("aria-current",b.dataset.p==p)||b.setAttribute("aria-current",b.dataset.p==p?"page":"false"));nav.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-current",b.dataset.p==p?"page":"false"));R[p]();window.scrollTo(0,0)}
const header=(eb,h,sub,extra="")=>`<div class="head"><div style="display:grid;gap:4px"><div class="eyebrow">${eb}</div><h1>${h}</h1>${sub?`<p class="mut" style="margin:0;max-width:80ch">${sub}</p>`:""}</div><div class="row noprint">${extra}<button class="btn" onclick="print()">Imprimir / PDF</button></div></div>`;
const segHTML=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([k,l])=>`<button data-v="${k}" aria-pressed="${k==cur}">${l}</button>`).join("")}</div>`;
const R={};
/* Visão geral */
let gDisc="LP";
R.geral=()=>{const all=ALS.map(a=>a.media);
 const kp=[[ALS.length,"alunos avaliados"],[pct(avg(D.flatMap(t=>t.feitos.map(a=>a.p)))),"média geral de acertos"],...DS.map(d=>[pct(avg(D.filter(t=>t.disc==d).flatMap(t=>t.feitos.map(a=>a.p)))),"média · "+DSH[d]]),
  [pct(100*all.filter(p=>p>=70).length/all.length),"alunos com média ≥70%"],[ALS.filter(a=>a.media<40).length,"alunos em atenção (<40%)"]];
 let h=`<tr><th>Turma</th><th>Professor(a)</th>${DS.map(d=>`<th style="text-align:center">${DSH[d]}</th>`).join("")}<th class="n">Geral</th><th class="n">Posição</th></tr>`;
 const rank=T.slice().sort((a,b)=>turmaMedia(b)-turmaMedia(a));
 T.forEach(k=>{h+=`<tr><td><b>${k}</b></td><td class="mut sm">${profOf(k)}</td>${DS.map(d=>{const t=get(k,d);return `<td class="c ${cls(t.m.media)}" tabindex="0" data-t="${k}" data-d="${d}" title="${DN[d]} · mediana ${pct(t.m.mediana)} · ${t.m.n} alunos">${pct(t.m.media)}</td>`}).join("")}<td class="n"><b>${pct(turmaMedia(k))}</b></td><td class="n mut">${rank.indexOf(k)+1}º</td></tr>`});
 const ts=T.map(k=>get(k,gDisc));
 main.innerHTML=header("Visão geral","Desempenho da escola na II Avaliação Diagnóstica","Anos iniciais, com 10 turmas e 30 provas. Os números são recalculados a partir da resposta de cada aluno em cada questão.")+
 `<section class="kpis">${kp.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("")}</section>
 <section class="panel"><div class="head"><h2>Mapa de calor · média de acertos</h2><div class="legend"><span style="--c:var(--ot)">Ótimo</span><span style="--c:var(--bo)">Bom</span><span style="--c:var(--re)">Regular</span><span style="--c:var(--in)">Insuficiente</span></div></div><div class="scroll"><table class="heat" id="heat">${h}</table></div><p class="mut sm" style="margin:0">Clique numa célula para abrir a comparação dessa turma.</p></section>
 <section class="g2"><div class="panel"><div class="head"><h2>Ranking de turmas</h2>${segHTML("gs",[["ALL","Geral"],...DS.map(d=>[d,DSH[d]])],gDisc)}</div><div id="rk"></div></div>
 <div class="panel"><div class="head"><h2>Dispersão dentro da turma</h2></div><p class="mut sm" style="margin:0">A caixa vai do 1º ao 3º quartil, a barra marca a mediana e o ponto laranja a média. Caixa larga significa turma heterogênea.</p><div id="bx"></div></div></section>
 <section class="panel"><h2>Indicadores por turma e disciplina</h2><div class="scroll" id="ind"></div></section>`;
