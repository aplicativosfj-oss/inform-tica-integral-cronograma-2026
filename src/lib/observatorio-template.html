function ring(p,{size=120,stroke=12,label=true}={}){const r=(size-stroke)/2,c=2*Math.PI*r,k=fx(p),v=Math.max(0,Math.min(100,p||0));
 return `<svg class="f-${k}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct(p)} de acertos"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--f)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>${label?`<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font:800 ${size*.24}px Sora;fill:var(--ink)">${pct(p)}</text>`:""}</svg>`}
function donut(c,{size=150}={}){const tot=Object.values(c).reduce((a,b)=>a+b,0)||1,r=size/2-14,C=2*Math.PI*r;let off=0,s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">`;
 ["OT","BO","RE","IN"].forEach(k=>{const L=C*c[k]/tot;if(L>0)s+=`<circle class="f-${k}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--f)" stroke-width="22" stroke-dasharray="${Math.max(0,L-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${F[k].p}: ${c[k]} alunos</title></circle>`;off+=L});
 return s+`<text x="50%" y="46%" text-anchor="middle" style="font:800 26px Sora;fill:var(--ink)">${tot}</text><text x="50%" y="62%" text-anchor="middle">alunos</text></svg>`}

const tabHab=hs=>`<div class="scroll"><table class="ht"><thead><tr><th style="width:44px">Q</th><th>Habilidade avaliada</th><th style="width:34%">Acertos da turma</th></tr></thead><tbody>${hs.map(h=>`<tr><td><b>${h.q}</b></td><td>${h.cod?`<span class="mut xs">${h.cod}</span><br>`:""}${esc(h.txt)}</td><td><div class="row" style="flex-wrap:nowrap;gap:8px"><div style="flex:1">${bar(h.p)}</div><b style="min-width:40px;text-align:right">${pct(h.p)}</b></div></td></tr>`).join("")}</tbody></table></div>`;
let dlgAba="geral";
function turmaDlg(k,d,aba){if(aba)dlgAba=aba;const t=get(k,d);
 const hs=t.qs.map((q,i)=>({q,p:t.qp[i],...hsplit(t.hab[q])}));const fracas=hs.filter(h=>h.p<70).sort((a,b)=>a.p-b.p).slice(0,3);
 const grupos=["IN","RE","BO","OT"].map(f=>({f,al:t.feitos.filter(a=>fx(a.p)==f).sort((a,b)=>a.p-b.p)}));
 const corpo={
  geral:`<div class="grid g2" style="align-items:center"><div class="row" style="gap:18px;flex-wrap:nowrap">${donut(t.dist,{size:140})}<div style="display:grid;gap:6px">${["OT","BO","RE","IN"].map(f=>`<div class="row sm" style="gap:8px;flex-wrap:nowrap"><span class="tag f-${f}">${F[f].p}</span><b>${t.dist[f]} alunos</b></div>`).join("")}</div></div>
   <div style="display:grid;gap:6px"><div class="label">Média da turma</div><div class="num">${pct(t.media)}</div><p class="sub">Média da escola nesta disciplina: ${pct(discM(d))}. ${t.media>=discM(d)?"A turma está <b>acima</b> da média da escola.":"A turma está <b>abaixo</b> da média da escola."}${t.ausentes?` ${t.ausentes} aluno(s) sem registro.`:""}</p></div></div>
   <div class="insight f-${fx(fracas.length?fracas[0].p:80)}"><div class="ic">${fracas.length?"!":"✓"}</div><p class="sm">${fracas.length?`Ponto mais frágil: <b>${esc(fracas[0].txt)}</b> (${pct(fracas[0].p)} de acertos). Veja a aba “O que fazer”.`:"Todas as habilidades estão acima de 70%."}</p></div>`,
  hab:tabHab(hs),
  acao:fracas.length?fracas.map(h=>`<div class="insight f-${fx(h.p)}"><div class="ic">Q${h.q}</div><div style="display:grid;gap:4px"><b>${esc(h.txt)} · ${pct(h.p)} de acertos</b><span class="sm">${nivelAcao(h.p)} ${dica(h.txt)}</span></div></div>`).join("")+`<div class="row">${linkAtiv(t.ano,d)}</div><p class="xs mut">As atividades têm três níveis, podem ser feitas no computador ou impressas. Para montar grupos com os nomes dos alunos, use a aba “Plano de ação”.</p>`:`<div class="insight f-OT"><div class="ic">✓</div><p>Todas as habilidades acima de 70%. Hora de aprofundar com desafios.</p></div>`,
  alunos:grupos.filter(g=>g.al.length).map(g=>`<div class="group"><span class="tag f-${g.f}">${F[g.f].p} · ${g.al.length}</span><div class="names">${g.al.map(a=>`<span>${esc(a.nome.replace(/\s*\(Especial\)/i,""))} <span class="mut">${pct(a.p)}</span></span>`).join("")}</div></div>`).join("")};
 document.getElementById("dlgBody").innerHTML=cab(esc(prof(k)),`${k} · ${DL[d]}`,"",`<div class="row between">${seg("dd",DS.map(x=>[x,DN[x]]),d)}${seg("da",[["geral","Visão geral"],["hab","Habilidades"],["acao","O que fazer"],["alunos","Alunos"]],dlgAba)}</div>`)+`<div style="display:grid;gap:12px">${corpo[dlgAba]}</div>`;
 abrirDlg();document.getElementById("dx").onclick=()=>dlgEl.close();bindSeg("dd",v=>turmaDlg(k,v));bindSeg("da",v=>turmaDlg(k,d,v))}
/* ================= HABILIDADES ================= */
let hD="CN",hA=0;
V.habilidades=()=>{
 main.innerHTML=`<div class="stack"><div class="card" style="display:grid;gap:14px"><div><h2>Mapa das habilidades</h2><p class="sub">Percentual de alunos que acertaram cada questão, nas turmas A e B. Vermelho e laranja mostram onde está a maior necessidade.</p></div>
  <div class="row between">${seg("hd",DS.map(d=>[d,DN[d]]),hD)}${seg("ha",[[0,"Todas"],...[1,2,3,4,5].map(a=>[a,a+"º ano"])],hA)}</div><div id="mx" class="grid g2" style="align-items:start"></div></div>
 <div class="card" style="display:grid;gap:12px"><h2>As 10 habilidades mais frágeis</h2><p class="sub">Somando as duas turmas de cada série. São os pontos que pedem ação coletiva dos professores.</p><div id="top10" style="display:grid;gap:8px"></div></div></div>`;
 const draw=()=>{const anos=hA?[hA]:[1,2,3,4,5];const mx=document.getElementById("mx");
  mx.style.gridTemplateColumns=hA?"1fr":"";
  mx.innerHTML=anos.map(a=>{const A=get(a+"º A",hD),B=get(a+"º B",hD);
   return `<div class="card flat" style="padding:12px"><div class="scroll"><table class="mx"><thead><tr><th>${a}º ano · ${DN[hD]}</th><th style="width:62px;text-align:center">A</th><th style="width:62px;text-align:center">B</th></tr></thead><tbody>${A.qs.map((q,i)=>{const h=hsplit(A.hab[q]);return `<tr><td class="sm"><span class="mut xs">Q${q}${h.cod?" · "+h.cod:""}</span><br>${esc(h.txt)}</td><td class="c f-${fx(A.qp[i])}">${pct(A.qp[i])}</td><td class="c f-${fx(B.qp[i])}">${pct(B.qp[i])}</td></tr>`}).join("")}</tbody></table></div></div>`}).join("");
  const agg=[];anos.forEach(a=>{const A=get(a+"º A",hD),B=get(a+"º B",hD);A.qs.forEach((q,i)=>{const n=A.feitos.length+B.feitos.length;agg.push({a,q,p:(A.qp[i]*A.feitos.length+B.qp[i]*B.feitos.length)/n,...hsplit(A.hab[q])})})});
  document.getElementById("top10").innerHTML=agg.sort((x,y)=>x.p-y.p).slice(0,10).map((h,i)=>`<div class="insight f-${fx(h.p)}" style="grid-template-columns:auto 1fr auto;align-items:center"><div class="ic">${i+1}</div><div style="display:grid;gap:2px"><b>${esc(h.txt)}</b><span class="sm mut">${h.a}º ano · questão ${h.q} · ${dica(h.txt)}</span></div><b style="font:800 18px Sora">${pct(h.p)}</b></div>`).join("")};
 bindSeg("hd",v=>{hD=v;draw()});bindSeg("ha",v=>{hA=+v;draw()});draw()};
/* ================= PLANO DE AÇÃO ================= */
const plano={k:"5º A",d:"LP"};
V.plano=()=>{
 main.innerHTML=`<div class="stack"><div class="card" style="display:grid;gap:14px">
  <div><h2>Plano de ação e reagrupamento</h2><p class="sub">Escolha a turma e a disciplina. O painel monta os grupos de trabalho pelas habilidades que cada aluno errou, sugere atividades e indica colegas que podem ajudar (monitores).</p></div>
  <div class="row noprint"><select id="pk" aria-label="Turma">${T.map(k=>`<option ${k==plano.k?"selected":""}>${k}</option>`).join("")}</select>${seg("pd",DS.map(d=>[d,DN[d]]),plano.d)}<button class="btn" onclick="print()">Imprimir plano</button><span id="plink"></span></div></div><div id="pbody" class="stack"></div></div>`;
 const draw=()=>{const t=get(plano.k,plano.d);const hs=t.qs.map((q,i)=>({q,i,p:t.qp[i],...hsplit(t.hab[q])}));
  const prio=hs.filter(h=>h.p<70).sort((a,b)=>a.p-b.p).slice(0,4);
  const nm=a=>esc(a.nome.replace(/\s*\(Especial\)/i,""));
  const monit=t.feitos.filter(a=>a.p>=80).sort((a,b)=>b.p-a.p);
  const grupos=prio.map(h=>({h,al:t.feitos.filter(a=>a.r[h.i]=="E"),mon:monit.filter(a=>a.r[h.i]=="C").slice(0,3)}));
  const intensivo=t.feitos.filter(a=>a.p<25);
  document.getElementById("plink").innerHTML=linkAtiv(t.ano,plano.d,"Atividades no site →");
  document.getElementById("pbody").innerHTML=`
  <section class="grid g3">
   <div class="card flat"><div class="label">Turma</div><div class="num">${plano.k}</div><p class="sub">${DL[plano.d]} · ${esc(prof(plano.k))}</p></div>
   <div class="card flat"><div class="label">Média</div><div class="num">${pct(t.media)}</div><p class="sub">${tag(t.media)}</p></div>
   <div class="card flat"><div class="label">Habilidades a retomar</div><div class="num">${prio.length}</div><p class="sub">com menos de 70% de acertos</p></div>
  </section>
  ${prio.length?`<section class="card" style="display:grid;gap:14px"><h2>Passo a passo sugerido</h2><ol class="steps">
   <li><div><b>Semana 1: retomada coletiva.</b> <span class="sub">Começar por “${esc(prio[0].txt)}”, a habilidade com menos acertos (${pct(prio[0].p)}).</span></div></li>
   <li><div><b>Semanas 2 e 3: grupos de trabalho.</b> <span class="sub">Organizar a turma nos grupos abaixo, cada um focado numa habilidade, com um monitor quando possível.</span></div></li>
   <li><div><b>Acompanhamento individual.</b> <span class="sub">${intensivo.length?`${intensivo.length} aluno(s) com menos de 25% de acertos: ${intensivo.map(nm).join(", ")}. Sugere-se apoio no contraturno e conversa com a família.`:"Nenhum aluno abaixo de 25% nesta disciplina."}</span></div></li>
   <li><div><b>Semana 4: nova verificação.</b> <span class="sub">Aplicar 1 ou 2 questões por habilidade trabalhada e comparar com este resultado.</span></div></li>
  </ol></section>
  <section class="grid g2">${grupos.map((g,i)=>`<div class="card" style="display:grid;gap:10px"><div class="row between" style="flex-wrap:nowrap"><span class="tag f-${fx(g.h.p)}">Grupo ${i+1} · ${pct(g.h.p)} de acertos</span><span class="xs mut">Questão ${g.h.q}</span></div><h3>${esc(g.h.txt)}</h3><p class="sm">${nivelAcao(g.h.p)} ${dica(g.h.txt)}</p><div class="label">Alunos que erraram (${g.al.length})</div><div class="names">${g.al.map(a=>`<span>${nm(a)}</span>`).join("")||'<span class="mut">nenhum</span>'}</div>${g.mon.length?`<div class="label">Podem ajudar como monitores</div><div class="names">${g.mon.map(a=>`<span style="background:color-mix(in srgb,var(--ot) 15%,transparent)">${nm(a)}</span>`).join("")}</div>`:""}</div>`).join("")}</section>`
  :`<div class="insight f-OT"><div class="ic">✓</div><p>Nesta disciplina a turma acertou 70% ou mais em todas as habilidades. Sugestão: projetos de aprofundamento e desafios.</p></div>`}`};
 document.getElementById("pk").onchange=e=>{plano.k=e.target.value;draw()};bindSeg("pd",v=>{plano.d=v;draw()});draw()};
/* ================= COMPARAR ================= */
const cmp={a:"5º A",b:"5º B",d:"LP",mode:"turmas"};let selA=[];
V.comparar=()=>{
 main.innerHTML=`<div class="stack"><div class="row between">${seg("cm",[["turmas","Comparar turmas"],["alunos","Comparar alunos"]],cmp.mode)}</div><div id="cbody" class="stack"></div></div>`;
 bindSeg("cm",v=>{cmp.mode=v;draw()});
 const opt=v=>T.map(k=>`<option ${k==v?"selected":""}>${k}</option>`).join("");
 const draw=()=>{const box=document.getElementById("cbody");
  if(cmp.mode=="turmas"){const A=cmp.a,B=cmp.b,same=A[0]==B[0];
   const gA=tMedia(A),gB=tMedia(B),dG=Math.round(gA)-Math.round(gB);
   const venc=(a,b)=>{const d=Math.round(a)-Math.round(b);return Math.abs(d)<3?`<span class="venc" style="--c:var(--mut)">Empate</span>`:`<span class="venc" style="--c:var(--${d>0?"ca":"cb"})">${d>0?A:B} na frente · +${Math.abs(d)}</span>`};
   const par=(a,b)=>`<div class="pb"><div class="b" style="--c:var(--ca)"><span>${A}</span><div class="trk"><i style="width:${cl(a)}%"></i></div><b>${pct(a)}</b></div><div class="b" style="--c:var(--cb)"><span>${B}</span><div class="trk"><i style="width:${cl(b)}%"></i></div><b>${pct(b)}</b></div></div>`;
   const frase=Math.abs(dG)<3?`As duas turmas tiveram resultado <b>parecido</b>: ${A} com ${pct(gA)} e ${B} com ${pct(gB)} de acertos em média.`:`<b>${dG>0?A:B}</b> acertou, em média, <span class="hl">${Math.abs(dG)} pontos a mais</span> que ${dG>0?B:A} (${pct(Math.max(gA,gB))} contra ${pct(Math.min(gA,gB))}).`;
   box.innerHTML=`<div class="card" style="display:grid;gap:16px">
    <div><h2>Qual turma foi melhor, e em quê?</h2><p class="sub">Escolha duas turmas. Azul é a primeira turma; laranja é a segunda.</p></div>
    <div class="vs"><div class="lado" style="--c:var(--ca)"><select id="ca" aria-label="Primeira turma">${opt(A)}</select><span class="sm mut">${esc(prof(A))}</span><div class="row" style="gap:10px">${ring(gA,{size:64,stroke:8})}<span class="sm">média geral</span></div></div>
     <div class="x">×</div>
     <div class="lado" style="--c:var(--cb)"><select id="cb" aria-label="Segunda turma">${opt(B)}</select><span class="sm mut">${esc(prof(B))}</span><div class="row" style="gap:10px">${ring(gB,{size:64,stroke:8})}<span class="sm">média geral</span></div></div></div>
    <div class="insight" style="--f:var(--${Math.abs(dG)<3?"mut":dG>0?"ca":"cb"})"><div class="ic">${Math.abs(dG)<3?"=":"★"}</div><p>${frase}</p></div>
   </div>
   <div class="card" style="display:grid;gap:14px"><h2>Disciplina por disciplina</h2><p class="sub">Percentual médio de acertos em cada prova.</p>
    <div class="grid g3">${DS.map(d=>{const a=get(A,d).media,b=get(B,d).media;return `<div class="duelo"><div class="row between" style="flex-wrap:nowrap"><b>${DN[d]}</b>${venc(a,b)}</div>${par(a,b)}</div>`}).join("")}</div></div>
   <div class="card" style="display:grid;gap:14px"><h2>Como os alunos estão distribuídos</h2><p class="sub">Quanto mais verde, mais alunos aprenderam bem. Vermelho e laranja são os alunos que precisam de apoio.</p>
    <div class="grid g2">${[[A,"ca"],[B,"cb"]].map(([k,c])=>`<div class="card flat" style="display:grid;gap:10px;border-left:6px solid var(--${c})"><b style="font:800 17px Sora">${k}</b>${DS.map(d=>`<div class="discline"><span>${DN[d]}</span>${distBar(get(k,d).dist)}<b>${pct(get(k,d).media)}</b></div>`).join("")}</div>`).join("")}</div>
    <div class="row xs" style="gap:14px">${["OT","BO","RE","IN"].map(f=>`<span class="tag f-${f}">${F[f].p}</span>`).join("")}</div></div>
   ${same?`<div class="card" style="display:grid;gap:14px"><div class="row between"><div><h2>Questão por questão</h2><p class="sub">As duas turmas fizeram a mesma prova. Onde a diferença é grande, uma turma pode aprender com a outra.</p></div>${seg("cd",DS.map(d=>[d,DN[d]]),cmp.d)}</div><div id="qq" style="display:grid;gap:14px"></div></div>`
   :`<div class="insight"><div class="ic">i</div><p class="sm">Turmas de séries diferentes fazem provas diferentes, por isso só dá para comparar as médias. Para ver questão por questão, escolha duas turmas da <b>mesma série</b> (por exemplo, 5º A e 5º B).</p></div>`}`;
   document.getElementById("ca").onchange=e=>{cmp.a=e.target.value;draw()};document.getElementById("cb").onchange=e=>{cmp.b=e.target.value;draw()};
   if(same){let ord="prova";const q=()=>{const ta=get(A,cmp.d),tb=get(B,cmp.d);
     let rows=ta.qs.map((x,i)=>({q:x,a:ta.qp[i],b:tb.qp[i],d:Math.round(ta.qp[i])-Math.round(tb.qp[i]),...hsplit(ta.hab[x])}));
     const nA=rows.filter(r=>r.d>=3).length,nB=rows.filter(r=>r.d<=-3).length,nE=rows.length-nA-nB;
     const top=rows.slice().sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).filter(r=>Math.abs(r.d)>=15).slice(0,3);
     if(ord=="dif")rows.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
     document.getElementById("qq").innerHTML=`<div class="placar"><div style="--c:var(--ca)"><b>${nA}</b>questões em que o ${A} foi melhor</div><div style="--c:var(--cb)"><b>${nB}</b>questões em que o ${B} foi melhor</div><div style="--c:var(--mut)"><b>${nE}</b>empates (diferença menor que 3 pontos)</div></div>
      ${top.length?`<div style="display:grid;gap:8px"><div class="label">Onde a diferença é maior</div>${top.map(r=>{const w=r.d>0?A:B,l=r.d>0?B:A;return `<div class="insight" style="--f:var(--${r.d>0?"ca":"cb"})"><div class="ic">Q${r.q}</div><p class="sm">Em <b>${esc(r.txt)}</b>, o <b>${w}</b> acertou ${pct(Math.max(r.a,r.b))} e o ${l}, ${pct(Math.min(r.a,r.b))}. Vale trocar experiências entre os professores sobre como essa habilidade foi trabalhada.</p></div>`}).join("")}</div>`:""}
      <div class="row between"><div class="label">Todas as questões</div>${seg("qo",[["prova","Ordem da prova"],["dif","Maiores diferenças primeiro"]],ord)}</div>
      <div>${rows.map(r=>`<div class="qrow"><div><span class="xs mut">Questão ${r.q}${r.cod?" · "+r.cod:""}</span><br><b class="sm">${esc(r.txt)}</b></div>${par(r.a,r.b)}<div>${venc(r.a,r.b)}</div></div>`).join("")}</div>`;
     bindSeg("qo",v=>{ord=v;q()})};
    q();bindSeg("cd",v=>{cmp.d=v;q()})}
  }else{
   if(!selA.length){const t=ALS.filter(a=>a.turma=="5º A").sort((a,b)=>b.media-a.media);selA=[t[0].id,t.at(-1).id]}
   const C=["var(--pri)","var(--chalk)","var(--ot)","var(--in)"];const S=selA.map(i=>AL[i]).filter(Boolean);
   box.innerHTML=`<div class="card" style="display:grid;gap:12px"><div class="row"><input id="as" list="al" placeholder="Digite o nome de um aluno…" style="flex:1;min-width:240px" aria-label="Adicionar aluno"><datalist id="al">${ALS.map(a=>`<option value="${esc(a.nome)} — ${a.turma}">`).join("")}</datalist></div>
    <div class="chips">${S.map((a,i)=>`<button class="chip" data-x="${a.id}" style="box-shadow:inset 4px 0 0 ${C[i]}">${esc(a.nome)} · ${a.turma} ✕</button>`).join("")}</div><p class="xs mut">Até 4 alunos. Dois alunos do 5º A vêm de exemplo; clique no nome para remover.</p></div>
    ${S.length?`<div class="grid g4">${S.map((a,i)=>`<div class="card" style="display:grid;gap:10px;border-top:5px solid ${C[i]}"><div><b>${esc(a.nome)}</b><p class="xs mut">${a.turma}</p></div><div class="row" style="gap:14px;flex-wrap:nowrap">${ring(a.media,{size:70,stroke:8})}${tag(a.media)}</div>${DS.map(d=>`<div class="discline" style="grid-template-columns:80px 1fr 40px"><span>${DN[d]}</span>${a.d[d]!=null?bar(a.d[d]):'<span class="xs mut">não fez</span>'}<b>${pct(a.d[d])}</b></div>`).join("")}</div>`).join("")}</div>`:""}`;
   const inp=document.getElementById("as");inp.onchange=()=>{const [n,t]=inp.value.split(" — ");const a=ALS.find(x=>x.nome==n&&x.turma==t);if(a&&!selA.includes(a.id)){if(selA.length>=4)selA.shift();selA.push(a.id)}draw()};
   box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{selA=selA.filter(x=>x!=b.dataset.x);draw()})}};
 draw()};
/* ================= ALUNOS ================= */
const lf={q:"",t:"",f:"",s:"media",dir:1};
V.alunos=()=>{
 main.innerHTML=`<div class="stack"><div class="card" style="display:grid;gap:14px"><div><h2>Todos os alunos</h2><p class="sub">Toque num aluno para ver a ficha com o que ele já domina e o que precisa retomar.</p></div>
  <div class="row noprint"><input id="lq" placeholder="Buscar pelo nome…" aria-label="Buscar" value="${esc(lf.q)}" style="flex:1;min-width:200px"><select id="lt" aria-label="Turma"><option value="">Todas as turmas</option>${T.map(k=>`<option ${k==lf.t?"selected":""}>${k}</option>`).join("")}</select><select id="lfx" aria-label="Faixa"><option value="">Todas as faixas</option>${["IN","RE","BO","OT"].map(k=>`<option value="${k}" ${k==lf.f?"selected":""}>${F[k].p}</option>`).join("")}</select></div>

  <div class="card" style="display:grid;gap:10px"><h2>Português × Matemática</h2><p class="sub">Cada ponto é um aluno. No canto vermelho estão os que precisam de apoio nas duas disciplinas; no verde, os que foram bem nas duas.</p><div id="sc" class="scat" style="max-width:680px"></div><div class="row xs">${[1,2,3,4,5].map(a=>`<span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="${SC[a]}"/></svg> ${a}º ano</span>`).join("")}</div></div></div>`;
