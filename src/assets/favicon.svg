<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="120"/>

  <!-- Borda/frame para mais destaque -->
  <rect width="512" height="512" fill="none" stroke="#16a34a" stroke-width="16" rx="120" opacity="0.9"/>

  <!-- Grupo principal centralizado -->
  <g transform="translate(126, 126)">
    <!-- Símbolo de agenda (círculo com linhas) -->
    <circle cx="80" cy="80" r="65" fill="none" stroke="#ffffff" stroke-width="16"/>

    <!-- Linhas de agenda dentro do círculo -->
    <line x1="40" y1="60" x2="120" y2="60" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <line x1="40" y1="95" x2="120" y2="95" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <line x1="40" y1="130" x2="120" y2="130" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

    <!-- Checkmark/seta verde (canto inferior direito) -->
    <g transform="translate(100, 100)">
      <circle cx="0" cy="0" r="45" fill="#16a34a"/>
      <polyline points="-15,0 -5,12 20,-10" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Destaque adicional (pequeno brilho) -->
  <circle cx="400" cy="80" r="60" fill="#16a34a" opacity="0.15"/>
</svg>
