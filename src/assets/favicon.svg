<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGradient)" rx="40"/>

  <!-- Laptop icon -->
  <g transform="translate(50, 40)">
    <!-- Screen -->
    <rect x="0" y="0" width="100" height="70" rx="6" fill="url(#bgGradient)" stroke="url(#accentGrad)" stroke-width="4"/>

    <!-- Inner screen -->
    <rect x="6" y="6" width="88" height="58" rx="4" fill="#1e3a8a" opacity="0.8"/>

    <!-- Circuit dots -->
    <circle cx="30" cy="25" r="3" fill="#f59e0b"/>
    <circle cx="45" cy="18" r="3" fill="#f59e0b"/>
    <circle cx="60" cy="28" r="3" fill="#f59e0b"/>

    <!-- Circuit lines -->
    <line x1="30" y1="25" x2="45" y2="18" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <line x1="45" y1="18" x2="60" y2="28" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>

    <!-- Keyboard -->
    <rect x="0" y="70" width="100" height="10" rx="2" fill="url(#accentGrad)"/>

    <!-- Stand -->
    <polygon points="35,80 65,80 60,95 40,95" fill="url(#accentGrad)"/>
  </g>

  <!-- Decorative corner accent -->
  <circle cx="165" cy="35" r="15" fill="#f59e0b" opacity="0.3"/>
</svg>
