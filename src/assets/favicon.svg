<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo gradiente profissional -->
  <rect width="200" height="200" fill="url(#bgGrad)"/>

  <!-- Overlay de padrão sutil -->
  <rect width="200" height="200" fill="url(#bgGrad)" opacity="0.3"/>

  <!-- Ícone de laptop -->
  <g transform="translate(40, 45)">
    <!-- Tela do laptop -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5" filter="url(#glow)"/>

    <!-- Brilho interno -->
    <rect x="6" y="6" width="108" height="68" rx="6" fill="#1e3a8a" opacity="0.7"/>

    <!-- Pontos de circuito (dourado) -->
    <circle cx="40" cy="28" r="4" fill="url(#goldGrad)"/>
    <circle cx="60" cy="20" r="4" fill="url(#goldGrad)"/>
    <circle cx="80" cy="32" r="4" fill="url(#goldGrad)"/>

    <!-- Linhas de conexão (dourado) -->
    <line x1="40" y1="28" x2="60" y2="20" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>
    <line x1="60" y1="20" x2="80" y2="32" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>

    <!-- Teclado -->
    <rect x="0" y="80" width="120" height="14" rx="2" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Detalhe do teclado -->
    <rect x="6" y="84" width="108" height="6" rx="1" fill="#1e3a8a" opacity="0.9"/>

    <!-- Suporte/dobradiça -->
    <polygon points="45,80 75,80 70,100 50,100" fill="url(#goldGrad)" opacity="0.95"/>
  </g>

  <!-- Destaque de canto (dourado) -->
  <circle cx="165" cy="35" r="18" fill="#fbbf24" opacity="0.15"/>
  <circle cx="165" cy="35" r="12" fill="url(#goldGrad)" opacity="0.25"/>
</svg>
