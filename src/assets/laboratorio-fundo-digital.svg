  <g stroke="#38bdf8" stroke-opacity="0.22">
    <path d="M0 352H1200M0 382H1200M0 422H1200M0 474H1200M0 540H1200"/>
  </g>

  <!-- bancada -->
  <rect x="0" y="470" width="1200" height="130" fill="#050a1a" fill-opacity="0.7"/>
  <rect x="0" y="468" width="1200" height="3" fill="#a5b4fc" fill-opacity="0.35"/>
</svg>
