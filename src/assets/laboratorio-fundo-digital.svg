<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#151a4a"/>
      <stop offset="1" stop-color="#071022"/>
    </linearGradient>
    <radialGradient id="luzA" cx="0.22" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzB" cx="0.85" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzC" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trilha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ee7b7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pontos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#c7d2fe" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#ceu)"/>
  <rect width="1200" height="600" fill="url(#pontos)"/>
  <rect width="1200" height="600" fill="url(#luzA)"/>
  <rect width="1200" height="600" fill="url(#luzB)"/>
  <rect width="1200" height="600" fill="url(#luzC)"/>

  <!-- trilhas de circuito -->
  <g fill="none" stroke="#a5b4fc" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 90h140l30 30h160l24-24h120"/>
    <path d="M0 160h80l40 40h110"/>
    <path d="M1200 70h-170l-30 30h-140l-26 26h-90"/>
    <path d="M1200 150h-90l-36 36h-150"/>
    <path d="M520 0v50l24 24v60"/>
    <path d="M760 0v34l-30 30v70"/>
  </g>
  <g fill="#6ee7b7" fill-opacity="0.55">
    <circle cx="474" cy="96" r="5"/>
    <circle cx="230" cy="200" r="5"/>
    <circle cx="634" cy="126" r="5"/>
    <circle cx="924" cy="186" r="5"/>
    <circle cx="544" cy="134" r="5"/>
    <circle cx="730" cy="134" r="5"/>
  </g>
  <rect x="140" y="88" width="320" height="4" fill="url(#trilha)"/>
  <rect x="760" y="98" width="300" height="4" fill="url(#trilha)"/>

