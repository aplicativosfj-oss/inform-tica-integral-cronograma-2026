  <rect y="330" width="1200" height="2" fill="#7dd3fc" fill-opacity="0.45"/>
  <g stroke="url(#chao)" stroke-width="1.5">
    <path d="M600 331L-600 600M600 331L-200 600M600 331L100 600M600 331L330 600M600 331L500 600M600 331L700 600M600 331L870 600M600 331L1100 600M600 331L1400 600M600 331L1800 600"/>
