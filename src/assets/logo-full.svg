<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="laptopGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Laptop outline -->
  <g id="laptop">
    <!-- Screen -->
    <rect x="30" y="20" width="140" height="85" rx="8" fill="url(#laptopGradient)" stroke="url(#accentGradient)" stroke-width="6"/>

    <!-- Screen inner glow -->
    <rect x="38" y="28" width="124" height="68" rx="4" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>

    <!-- Circuit nodes and lines (golden) -->
    <circle cx="65" cy="45" r="4" fill="#f59e0b"/>
    <circle cx="75" cy="38" r="4" fill="#f59e0b"/>
    <circle cx="85" cy="50" r="4" fill="#f59e0b"/>

    <!-- Connection lines -->
    <line x1="65" y1="45" x2="75" y2="38" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
    <line x1="75" y1="38" x2="85" y2="50" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>

    <!-- Keyboard base -->
    <rect x="20" y="105" width="160" height="12" rx="2" fill="url(#accentGradient)"/>

    <!-- Keyboard detail -->
    <rect x="25" y="108" width="150" height="6" rx="1" fill="#1e40af" opacity="0.8"/>

    <!-- Stand/hinge -->
    <polygon points="70,105 90,105 85,120 75,120" fill="url(#accentGradient)"/>
  </g>

  <!-- Text: AGENDA -->
  <text x="200" y="75" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#1e40af" letter-spacing="2">
    AGENDA
  </text>

  <!-- Text: INFORMÁTICA ONLINE (smaller, gold) -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#f59e0b" letter-spacing="1">
    INFORMÁTICA ONLINE
  </text>

  <!-- Decorative line -->
  <line x1="200" y1="125" x2="600" y2="125" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

  <!-- Small tagline -->
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1e40af" opacity="0.7" letter-spacing="0.5">
    CRONOGRAMA AUTOMÁTICO DE AULAS
  </text>
</svg>
