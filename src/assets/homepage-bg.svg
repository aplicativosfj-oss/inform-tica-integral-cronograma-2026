<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.1" />
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>

    <pattern id="dots" x="80" y="80" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="2" fill="#3b82f6" opacity="0.15"/>
    </pattern>

    <pattern id="grid" x="120" y="120" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Base gradient background -->
  <rect width="1920" height="1080" fill="url(#grad1)"/>

  <!-- Subtle dot pattern -->
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Grid pattern -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Decorative circles with blur effect -->
  <circle cx="-200" cy="-150" r="600" fill="#3b82f6" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1920" cy="1080" r="700" fill="#2563eb" opacity="0.06" filter="url(#blur)"/>
  <circle cx="1200" cy="400" r="500" fill="#1e40af" opacity="0.05" filter="url(#blur)"/>

  <!-- Flowing abstract lines -->
  <path d="M 0 200 Q 480 150, 960 200 T 1920 200" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.15"/>
  <path d="M 0 400 Q 480 350, 960 400 T 1920 400" stroke="#2563eb" stroke-width="1.5" fill="none" opacity="0.1"/>
  <path d="M 0 600 Q 480 550, 960 600 T 1920 600" stroke="#1e40af" stroke-width="2" fill="none" opacity="0.12"/>
  <path d="M 0 800 Q 480 750, 960 800 T 1920 800" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.08"/>

  <!-- Geometric accent shapes -->
  <g opacity="0.1">
    <circle cx="200" cy="150" r="80" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="200" cy="150" r="60" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="200" cy="150" r="40" fill="none" stroke="#3b82f6" stroke-width="0.5"/>
  </g>

  <g opacity="0.08">
    <circle cx="1700" cy="250" r="100" fill="none" stroke="#2563eb" stroke-width="2"/>
    <circle cx="1700" cy="250" r="70" fill="none" stroke="#2563eb" stroke-width="1"/>
  </g>

  <!-- Network-like connecting lines (subtle tech feel) -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.1" stroke-dasharray="5,5">
    <line x1="300" y1="300" x2="600" y2="400"/>
    <line x1="600" y1="400" x2="900" y2="300"/>
    <line x1="900" y1="300" x2="1200" y2="500"/>
    <line x1="1200" y1="500" x2="1500" y2="350"/>
  </g>

  <!-- Educational/Learning symbols -->
  <g opacity="0.08">
    <!-- Book shape -->
    <path d="M 150 700 L 150 750 Q 150 780, 180 780 L 250 780 Q 280 780, 280 750 L 280 700" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="215" y1="700" x2="215" y2="780" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <g opacity="0.07">
    <!-- Graduation cap shape -->
    <polygon points="1750,850 1780,900 1820,900 1850,850" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
    <line x1="1700" y1="900" x2="1900" y2="900" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Subtle radial accent in corners -->
  <g opacity="0.06">
    <circle cx="100" cy="950" r="150" fill="none" stroke="#1e40af" stroke-width="1" stroke-dasharray="10,5"/>
    <circle cx="1850" cy="100" r="120" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8,4"/>
  </g>

  <!-- Additional light rays for depth -->
  <g opacity="0.05">
    <line x1="960" y1="0" x2="800" y2="400" stroke="#3b82f6" stroke-width="2"/>
    <line x1="960" y1="0" x2="1120" y2="400" stroke="#3b82f6" stroke-width="2"/>
  </g>
</svg>
